[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-ads-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Google Ads API integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Trellis", email = "engineering@gotrellis.com" }]
dependencies = [
    # MCP SDK — official Python implementation.
    "mcp>=1.0.0",
    # Google Ads + Google OAuth client.
    "google-ads>=23.1.0",
    "google-auth>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
# Installed by `uv pip install -e .` (or sync via a `[tool.uv.sources]` entry
# in clio-idx). The clio-idx subprocess wiring does
# ``Popen(["google-ads-mcp", ...])`` so the executable name must match.
google-ads-mcp = "google_ads_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/google_ads_mcp"]
