name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked, because uv.lock is this server's dependency closure: it is
      # what clio-idx's installer builds from, so CI must test that exact set
      # rather than whatever a fresh resolve would pick.
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
